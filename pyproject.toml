[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge"
version = "1.0.0"
description = "State-vector quantum circuit simulator with matching C++, Python and JavaScript engines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Te-Wei Ko" }]
keywords = ["quantum-computing", "state-vector", "simulator", "deutsch-jozsa", "educational"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/TeWei02/qbridge"
Source = "https://github.com/TeWei02/qbridge"

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

# 範例電路跟著套件一起裝，pip 安裝後 qbridge --list 才有東西可跑。
# 裝到 <prefix>/share/qbridge/circuits，cli.default_circuit_dir() 會找到它。
[tool.setuptools.data-files]
"share/qbridge/circuits" = ["circuits/*.qc"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
