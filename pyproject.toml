[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge"
version = "1.0.0"
description = "State-vector quantum circuit simulator with matching C++, Python and JavaScript engines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Te-Wei Ko" }]
keywords = ["quantum-computing", "state-vector", "simulator", "deutsch-jozsa", "educational"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/TeWei02/qbridge"
Source = "https://github.com/TeWei02/qbridge"

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
